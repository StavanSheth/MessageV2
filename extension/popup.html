<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mavon Bridge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 320px;
      background: #061510;
      color: #e2e8f0;
      padding: 14px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(16, 185, 129, 0.2);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .brand img {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid rgba(52, 211, 153, 0.4);
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #f1f5f9;
    }
    .brand-title span {
      color: #34d399;
    }
    .version-pill {
      font-size: 10px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 2px 7px;
      border-radius: 12px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-card {
      margin-top: 12px;
      background: rgba(10, 37, 28, 0.7);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 8px;
      padding: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #94a3b8;
    }
    .dot.connected {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite ease-in-out;
    }
    .dot.connecting {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.9); }
    }
    .status-text {
      font-size: 12px;
      font-weight: 600;
      color: #f8fafc;
    }
    .status-meta {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: #94a3b8;
    }
    .meta-item {
      display: flex;
      justify-content: space-between;
    }
    .meta-val {
      color: #cbd5e1;
      font-family: monospace;
      font-size: 10px;
    }
    .feature-list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.4);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .feature-item.highlight {
      border-color: rgba(16, 185, 129, 0.2);
      color: #a7f3d0;
    }
    .feature-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #34d399;
    }
    .actions-grid {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      outline: none;
    }
    .btn-primary {
      background: #059669;
      color: #ffffff;
      border-color: #10b981;
    }
    .btn-primary:hover {
      background: #10b981;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      border-color: rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .btn-full {
      grid-column: span 2;
    }
    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 10px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon32.png" alt="Mavon">
      <div class="brand-title">Mavon <span>Bridge</span></div>
    </div>
    <div class="version-pill">v1.2</div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <div class="status-indicator">
        <div id="statusDot" class="dot"></div>
        <span id="statusLabel" class="status-text">Checking bridge...</span>
      </div>
      <button id="reconnectBtn" class="btn btn-secondary" style="padding: 3px 8px; font-size: 10px;">Retry</button>
    </div>
    <div class="status-meta">
      <div class="meta-item">
        <span>Backend Host:</span>
        <span class="meta-val">127.0.0.1:8000</span>
      </div>
      <div class="meta-item">
        <span>Instagram Tab:</span>
        <span id="tabStatus" class="meta-val">Scanning...</span>
      </div>
    </div>
  </div>

  <div class="feature-list">
    <div class="feature-item highlight">
      <div class="feature-dot"></div>
      <span>Zero Credential Sharing Architecture</span>
    </div>
    <div class="feature-item">
      <div class="feature-dot"></div>
      <span>Live DOM & Inbound Reply Monitoring</span>
    </div>
  </div>

  <div class="actions-grid">
    <button id="openDashboardBtn" class="btn btn-primary btn-full">Open Mavon Dashboard</button>
    <button id="openInstagramBtn" class="btn btn-secondary btn-full">Open Instagram Web</button>
  </div>

  <div class="footer">
    Mavon Outreach OS • Encrypted Local Loop
  </div>

  <script src="popup.js"></script>
</body>
</html>
